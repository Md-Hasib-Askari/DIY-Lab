services:
  postgres:
    image: postgres:16-alpine
    container_name: observability-lab-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - observability-lab-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - observability-lab-net

volumes:
  observability-lab-pg-data:

networks:
  observability-lab-net:
    name: observability-lab-net
