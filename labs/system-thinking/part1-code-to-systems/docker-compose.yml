services:
  postgres:
    image: postgres:16-alpine
    container_name: system-thinking-lab-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: diy_lab
    ports:
      - "5433:5432"
    volumes:
      - system-thinking-lab-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d diy_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  system-thinking-lab-pg-data: